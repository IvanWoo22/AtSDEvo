name: atsdevo
# BISER 仅提供 Linux x86-64 构建，使用独立环境 environment-biser-linux.yml。
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - numpy
  - scipy
  - matplotlib
  - blast>=2.15
  - mafft>=7.5
  - muscle>=5
  - prank
  - iqtree>=3
  - gffread
  - bedtools
  - samtools
  - mcscanx=1.0.0
